<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Space Invaders</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      background: #030712;
      color: #f8fafc;
      font-family: 'Courier New', Courier, monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
    }
    .hud {
      width: 480px;
      max-width: 95vw;
      display: flex;
      justify-content: space-between;
      font-size: 16px;
      font-weight: bold;
      margin-bottom: 8px;
    }
    canvas {
      background: #0b0f19;
      border: 3px solid #1f2937;
      border-radius: 8px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.7);
    }
    .hint {
      margin-top: 10px;
      font-size: 13px;
      color: #9ca3af;
      font-family: system-ui, sans-serif;
    }
  </style>
</head>
<body>
  <div class="hud">
    <div>SCORE: <span id="score" style="color: #38bdf8;">0</span></div>
    <div>LIVES: <span id="lives" style="color: #22c55e;">▲▲▲</span></div>
  </div>
  <canvas id="canvas" width="480" height="400"></canvas>
  <div class="hint">Use <strong>LEFT / RIGHT</strong> or <strong>A / D</strong> to move, <strong>SPACE</strong> to shoot</div>

  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const scoreEl = document.getElementById('score');
    const livesEl = document.getElementById('lives');

    let score = 0;
    let lives = 3;
    let gameOver = false;
    let victory = false;

    const player = {
      x: canvas.width / 2 - 15,
      y: canvas.height - 35,
      width: 30,
      height: 16,
      speed: 5
    };

    let bullets = [];
    let alienBullets = [];
    let aliens = [];
    let alienDir = 1;
    let alienStepDown = false;
    let alienSpeed = 0.8;
    let lastShoot = 0;

    function initAliens() {
      aliens = [];
      const rows = 4;
      const cols = 8;
      for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
          aliens.push({
            x: 40 + c * 48,
            y: 35 + r * 35,
            width: 26,
            height: 20,
            type: r,
            alive: true
          });
        }
      }
    }

    function initGame() {
      score = 0;
      lives = 3;
      gameOver = false;
      victory = false;
      scoreEl.innerText = score;
      updateLives();
      bullets = [];
      alienBullets = [];
      player.x = canvas.width / 2 - 15;
      alienDir = 1;
      alienSpeed = 0.8;
      initAliens();
    }

    function updateLives() {
      livesEl.innerText = '▲ '.repeat(Math.max(0, lives));
    }

    const keys = {};
    window.addEventListener('keydown', e => {
      keys[e.code] = true;
      if (e.code === 'Space') {
        const now = Date.now();
        if (now - lastShoot > 250 && !gameOver && !victory) {
          bullets.push({ x: player.x + player.width / 2, y: player.y, speed: 7 });
          lastShoot = now;
        }
        if (gameOver || victory) initGame();
        e.preventDefault();
      }
    });
    window.addEventListener('keyup', e => { keys[e.code] = false; });

    function update() {
      if (gameOver || victory) return;

      if (keys['ArrowLeft'] || keys['KeyA']) player.x -= player.speed;
      if (keys['ArrowRight'] || keys['KeyD']) player.x += player.speed;
      player.x = Math.max(10, Math.min(canvas.width - player.width - 10, player.x));

      // Player bullets
      for (let i = bullets.length - 1; i >= 0; i--) {
        bullets[i].y -= bullets[i].speed;
        if (bullets[i].y < 0) {
          bullets.splice(i, 1);
          continue;
        }

        // Alien collision
        for (let a of aliens) {
          if (a.alive &&
              bullets[i] &&
              bullets[i].x >= a.x && bullets[i].x <= a.x + a.width &&
              bullets[i].y >= a.y && bullets[i].y <= a.y + a.height) {
            a.alive = false;
            bullets.splice(i, 1);
            score += 20 * (4 - a.type);
            scoreEl.innerText = score;
            alienSpeed += 0.04;
            break;
          }
        }
      }

      // Check alien bounds & move
      let edgeReached = false;
      const aliveAliens = aliens.filter(a => a.alive);
      if (aliveAliens.length === 0) {
        victory = true;
        return;
      }

      for (let a of aliveAliens) {
        if ((a.x + a.width >= canvas.width - 15 && alienDir > 0) ||
            (a.x <= 15 && alienDir < 0)) {
          edgeReached = true;
          break;
        }
      }

      if (edgeReached) {
        alienDir *= -1;
        for (let a of aliveAliens) {
          a.y += 14;
          if (a.y + a.height >= player.y) {
            gameOver = true;
          }
        }
      } else {
        for (let a of aliveAliens) {
          a.x += alienDir * alienSpeed;
        }
      }

      // Alien shooting
      if (Math.random() < 0.025 && aliveAliens.length > 0) {
        const shooter = aliveAliens[Math.floor(Math.random() * aliveAliens.length)];
        alienBullets.push({ x: shooter.x + shooter.width / 2, y: shooter.y + shooter.height, speed: 3.5 });
      }

      // Alien bullets move & collision
      for (let i = alienBullets.length - 1; i >= 0; i--) {
        const b = alienBullets[i];
        b.y += b.speed;
        if (b.y > canvas.height) {
          alienBullets.splice(i, 1);
          continue;
        }

        if (b.x >= player.x && b.x <= player.x + player.width &&
            b.y >= player.y && b.y <= player.y + player.height) {
          alienBullets.splice(i, 1);
          lives--;
          updateLives();
          if (lives <= 0) gameOver = true;
          break;
        }
      }
    }

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // Stars in background
      ctx.fillStyle = 'rgba(255, 255, 255, 0.2)';
      for (let i = 0; i < 25; i++) {
        ctx.fillRect((i * 47) % canvas.width, (i * 31) % canvas.height, 2, 2);
      }

      // Player cannon
      ctx.fillStyle = '#22c55e';
      ctx.fillRect(player.x, player.y + 6, player.width, player.height - 6);
      ctx.fillRect(player.x + player.width / 2 - 3, player.y, 6, 6);

      // Bullets
      ctx.fillStyle = '#38bdf8';
      bullets.forEach(b => ctx.fillRect(b.x - 1.5, b.y, 3, 10));

      // Alien bullets
      ctx.fillStyle = '#ef4444';
      alienBullets.forEach(b => ctx.fillRect(b.x - 1.5, b.y, 3, 8));

      // Aliens
      aliens.forEach(a => {
        if (!a.alive) return;
        const colors = ['#f43f5e', '#fb923c', '#eab308', '#a855f7'];
        ctx.fillStyle = colors[a.type];
        // Classic invader blocky body
        ctx.fillRect(a.x + 4, a.y + 2, a.width - 8, a.height - 4);
        ctx.fillRect(a.x, a.y + 6, a.width, a.height - 10);
        // Eyes
        ctx.fillStyle = '#0b0f19';
        ctx.fillRect(a.x + 6, a.y + 7, 3, 3);
        ctx.fillRect(a.x + a.width - 9, a.y + 7, 3, 3);
      });

      if (gameOver) {
        ctx.fillStyle = 'rgba(3, 7, 18, 0.85)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = '#ef4444';
        ctx.font = 'bold 26px "Courier New"';
        ctx.textAlign = 'center';
        ctx.fillText('INVASION SUCCEEDED - GAME OVER', canvas.width / 2, canvas.height / 2);
        ctx.fillStyle = '#9ca3af';
        ctx.font = '14px system-ui';
        ctx.fillText('Press SPACE to Restart', canvas.width / 2, canvas.height / 2 + 35);
      } else if (victory) {
        ctx.fillStyle = 'rgba(3, 7, 18, 0.85)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = '#22c55e';
        ctx.font = 'bold 28px "Courier New"';
        ctx.textAlign = 'center';
        ctx.fillText('EARTH SAVED! VICTORY!', canvas.width / 2, canvas.height / 2);
        ctx.fillStyle = '#9ca3af';
        ctx.font = '14px system-ui';
        ctx.fillText('Press SPACE to Play Again', canvas.width / 2, canvas.height / 2 + 35);
      }
    }

    function loop() {
      update();
      draw();
      requestAnimationFrame(loop);
    }

    initGame();
    loop();
  </script>
</body>
</html>
