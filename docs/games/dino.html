<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dino T-Rex Runner</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      background: #f7f7f7;
      color: #535353;
      font-family: 'Courier New', Courier, monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
    }
    .container {
      position: relative;
      width: 600px;
      max-width: 95vw;
    }
    .score-bar {
      display: flex;
      justify-content: flex-end;
      font-size: 18px;
      font-weight: bold;
      letter-spacing: 2px;
      margin-bottom: 8px;
      color: #535353;
    }
    canvas {
      background: #ffffff;
      border: 2px solid #e5e7eb;
      border-radius: 8px;
      display: block;
      width: 100%;
    }
    .hint {
      margin-top: 14px;
      font-size: 14px;
      color: #737373;
      text-align: center;
      font-family: system-ui, sans-serif;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="score-bar">
      <span style="color: #9ca3af; margin-right: 12px;" id="hiScore">HI 00000</span>
      <span id="score">00000</span>
    </div>
    <canvas id="dinoCanvas" width="600" height="200"></canvas>
    <div class="hint">Press <strong>SPACE</strong> or <strong>UP ARROW</strong> to jump, <strong>DOWN</strong> to duck</div>
  </div>

  <script>
    const canvas = document.getElementById('dinoCanvas');
    const ctx = canvas.getContext('2d');
    const scoreEl = document.getElementById('score');
    const hiScoreEl = document.getElementById('hiScore');

    let hiScore = parseInt(localStorage.getItem('dino_hi') || '0', 10);
    hiScoreEl.innerText = 'HI ' + String(hiScore).padStart(5, '0');

    let isPlaying = false;
    let isGameOver = false;
    let score = 0;
    let speed = 6;
    let groundOffset = 0;

    const dino = {
      x: 40,
      y: 140,
      width: 36,
      height: 42,
      dy: 0,
      gravity: 0.85,
      jumpPower: -13,
      isGrounded: true,
      ducking: false
    };

    let obstacles = [];
    let clouds = [
      { x: 200, y: 30 },
      { x: 450, y: 50 }
    ];

    function reset() {
      score = 0;
      speed = 6;
      obstacles = [];
      dino.y = 140;
      dino.dy = 0;
      dino.isGrounded = true;
      dino.ducking = false;
      isGameOver = false;
      isPlaying = true;
    }

    function jump() {
      if (isGameOver) {
        reset();
        return;
      }
      if (!isPlaying) {
        isPlaying = true;
      }
      if (dino.isGrounded) {
        dino.dy = dino.jumpPower;
        dino.isGrounded = false;
      }
    }

    window.addEventListener('keydown', e => {
      if (e.code === 'Space' || e.code === 'ArrowUp') {
        jump();
        e.preventDefault();
      }
      if (e.code === 'ArrowDown') {
        dino.ducking = true;
        if (dino.isGrounded) {
          dino.height = 24;
          dino.y = 158;
        }
      }
    });

    window.addEventListener('keyup', e => {
      if (e.code === 'ArrowDown') {
        dino.ducking = false;
        dino.height = 42;
        if (dino.isGrounded) dino.y = 140;
      }
    });

    canvas.addEventListener('pointerdown', jump);

    function spawnObstacle() {
      const type = Math.random() > 0.4 ? 'cactus' : 'double-cactus';
      obstacles.push({
        x: canvas.width + 50,
        y: 144,
        width: type === 'cactus' ? 16 : 32,
        height: 38
      });
    }

    let lastSpawnTime = 0;

    function update() {
      if (!isPlaying || isGameOver) return;

      score += 0.15;
      speed = 6 + Math.floor(score / 100) * 0.5;
      scoreEl.innerText = String(Math.floor(score)).padStart(5, '0');

      // Dino physics
      dino.dy += dino.gravity;
      dino.y += dino.dy;
      const groundLevel = dino.ducking ? 158 : 140;

      if (dino.y >= groundLevel) {
        dino.y = groundLevel;
        dino.dy = 0;
        dino.isGrounded = true;
      }

      // Obstacles
      lastSpawnTime++;
      if (lastSpawnTime > 80 + Math.random() * 60) {
        spawnObstacle();
        lastSpawnTime = 0;
      }

      for (let i = obstacles.length - 1; i >= 0; i--) {
        const obs = obstacles[i];
        obs.x -= speed;

        // Collision check
        if (
          dino.x < obs.x + obs.width &&
          dino.x + dino.width > obs.x &&
          dino.y < obs.y + obs.height &&
          dino.y + dino.height > obs.y
        ) {
          gameOver();
          return;
        }

        if (obs.x < -40) {
          obstacles.splice(i, 1);
        }
      }

      // Clouds
      clouds.forEach(c => {
        c.x -= speed * 0.2;
        if (c.x < -60) c.x = canvas.width + Math.random() * 80;
      });

      groundOffset = (groundOffset + speed) % 20;
    }

    function gameOver() {
      isGameOver = true;
      if (score > hiScore) {
        hiScore = Math.floor(score);
        localStorage.setItem('dino_hi', hiScore);
        hiScoreEl.innerText = 'HI ' + String(hiScore).padStart(5, '0');
      }
    }

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // Clouds
      ctx.fillStyle = '#d1d5db';
      clouds.forEach(c => {
        ctx.beginPath();
        ctx.arc(c.x, c.y, 14, 0, Math.PI * 2);
        ctx.arc(c.x + 12, c.y - 6, 16, 0, Math.PI * 2);
        ctx.arc(c.x + 24, c.y, 14, 0, Math.PI * 2);
        ctx.fill();
      });

      // Ground line
      ctx.strokeStyle = '#535353';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(0, 180);
      ctx.lineTo(canvas.width, 180);
      ctx.stroke();

      // Ground bumps
      for (let x = -groundOffset; x < canvas.width; x += 30) {
        ctx.fillStyle = '#9ca3af';
        ctx.fillRect(x, 184, 4, 2);
      }

      // Dino
      ctx.fillStyle = '#535353';
      if (dino.ducking && dino.isGrounded) {
        ctx.fillRect(dino.x, dino.y, 44, 22);
        // Eye
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(dino.x + 36, dino.y + 4, 3, 3);
      } else {
        // Body & head
        ctx.fillRect(dino.x + 8, dino.y, 24, 28);
        ctx.fillRect(dino.x + 18, dino.y - 4, 16, 16);
        // Eye
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(dino.x + 28, dino.y, 3, 3);
        ctx.fillStyle = '#535353';
        // Legs
        ctx.fillRect(dino.x + 10, dino.y + 28, 6, 14);
        ctx.fillRect(dino.x + 22, dino.y + 28, 6, 14);
        // Tail
        ctx.fillRect(dino.x, dino.y + 12, 8, 10);
      }

      // Obstacles (Cactus)
      ctx.fillStyle = '#535353';
      obstacles.forEach(obs => {
        ctx.fillRect(obs.x, obs.y, obs.width, obs.height);
        // Arms
        ctx.fillRect(obs.x - 4, obs.y + 8, 4, 14);
        ctx.fillRect(obs.x + obs.width, obs.y + 12, 4, 12);
      });

      if (!isPlaying) {
        ctx.fillStyle = '#535353';
        ctx.font = 'bold 16px "Courier New"';
        ctx.textAlign = 'center';
        ctx.fillText('PRESS SPACE TO RUN', canvas.width / 2, 100);
      } else if (isGameOver) {
        ctx.fillStyle = '#535353';
        ctx.font = 'bold 20px "Courier New"';
        ctx.textAlign = 'center';
        ctx.fillText('G A M E   O V E R', canvas.width / 2, 80);
        ctx.font = '14px "Courier New"';
        ctx.fillText('PRESS SPACE TO RESTART', canvas.width / 2, 110);
      }
    }

    function gameLoop() {
      update();
      draw();
      requestAnimationFrame(gameLoop);
    }

    gameLoop();
  </script>
</body>
</html>
