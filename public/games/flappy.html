<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flappy Bird</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      background: #0f172a;
      color: white;
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
    }
    canvas {
      border: 3px solid #334155;
      border-radius: 12px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
      cursor: pointer;
    }
    .hint {
      margin-top: 10px;
      font-size: 13px;
      color: #94a3b8;
    }
  </style>
</head>
<body>
  <canvas id="canvas" width="360" height="500"></canvas>
  <div class="hint">Press <strong>SPACE</strong> or <strong>CLICK / TAP</strong> to flap</div>

  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');

    const bird = {
      x: 60,
      y: 200,
      radius: 14,
      velocity: 0,
      gravity: 0.28,
      jump: -5.8
    };

    let pipes = [];
    let score = 0;
    let highScore = localStorage.getItem('flappy_best') || 0;
    let gameState = 'START'; // 'START' | 'PLAYING' | 'OVER'
    let frameCount = 0;

    function reset() {
      bird.y = 200;
      bird.velocity = 0;
      pipes = [];
      score = 0;
      frameCount = 0;
      gameState = 'PLAYING';
    }

    function flap() {
      if (gameState === 'START' || gameState === 'OVER') {
        reset();
      } else if (gameState === 'PLAYING') {
        bird.velocity = bird.jump;
      }
    }

    window.addEventListener('keydown', e => {
      if (e.code === 'Space' || e.code === 'ArrowUp') {
        flap();
        e.preventDefault();
      }
    });
    canvas.addEventListener('pointerdown', flap);

    function loop() {
      update();
      draw();
      requestAnimationFrame(loop);
    }

    function update() {
      if (gameState !== 'PLAYING') return;

      frameCount++;
      bird.velocity += bird.gravity;
      bird.y += bird.velocity;

      // Spawn pipes
      if (frameCount % 90 === 0) {
        const gap = 120;
        const minHeight = 40;
        const maxHeight = canvas.height - gap - minHeight - 60;
        const topHeight = Math.floor(Math.random() * (maxHeight - minHeight)) + minHeight;
        pipes.push({
          x: canvas.width,
          top: topHeight,
          bottom: topHeight + gap,
          passed: false
        });
      }

      // Move pipes & collision
      for (let i = pipes.length - 1; i >= 0; i--) {
        const p = pipes[i];
        p.x -= 2.2;

        // Score
        if (!p.passed && p.x + 48 < bird.x) {
          p.passed = true;
          score++;
        }

        // Collision with pipes
        if (bird.x + bird.radius > p.x && bird.x - bird.radius < p.x + 48) {
          if (bird.y - bird.radius < p.top || bird.y + bird.radius > p.bottom) {
            endGame();
            return;
          }
        }

        if (p.x < -60) {
          pipes.splice(i, 1);
        }
      }

      // Floor & ceiling collision
      if (bird.y + bird.radius >= canvas.height - 40 || bird.y - bird.radius <= 0) {
        endGame();
      }
    }

    function endGame() {
      gameState = 'OVER';
      if (score > highScore) {
        highScore = score;
        localStorage.setItem('flappy_best', highScore);
      }
    }

    function draw() {
      // Sky background
      const skyGrad = ctx.createLinearGradient(0, 0, 0, canvas.height);
      skyGrad.addColorStop(0, '#38bdf8');
      skyGrad.addColorStop(0.7, '#7dd3fc');
      skyGrad.addColorStop(1, '#bae6fd');
      ctx.fillStyle = skyGrad;
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Clouds
      ctx.fillStyle = 'rgba(255, 255, 255, 0.6)';
      ctx.beginPath();
      ctx.arc(80, 80, 24, 0, Math.PI * 2);
      ctx.arc(110, 75, 30, 0, Math.PI * 2);
      ctx.arc(140, 80, 22, 0, Math.PI * 2);
      ctx.fill();

      ctx.beginPath();
      ctx.arc(260, 140, 20, 0, Math.PI * 2);
      ctx.arc(285, 135, 26, 0, Math.PI * 2);
      ctx.arc(310, 140, 18, 0, Math.PI * 2);
      ctx.fill();

      // Pipes
      pipes.forEach(p => {
        // Top pipe
        ctx.fillStyle = '#22c55e';
        ctx.fillRect(p.x, 0, 48, p.top);
        ctx.fillStyle = '#16a34a';
        ctx.fillRect(p.x - 2, p.top - 20, 52, 20);

        // Bottom pipe
        ctx.fillStyle = '#22c55e';
        ctx.fillRect(p.x, p.bottom, 48, canvas.height - p.bottom);
        ctx.fillStyle = '#16a34a';
        ctx.fillRect(p.x - 2, p.bottom, 52, 20);
      });

      // Ground
      ctx.fillStyle = '#854d0e';
      ctx.fillRect(0, canvas.height - 40, canvas.width, 40);
      ctx.fillStyle = '#22c55e';
      ctx.fillRect(0, canvas.height - 40, canvas.width, 8);

      // Bird
      ctx.save();
      ctx.translate(bird.x, bird.y);
      let angle = Math.min(Math.PI / 4, Math.max(-Math.PI / 4, bird.velocity * 0.08));
      ctx.rotate(angle);

      // Body
      ctx.fillStyle = '#eab308';
      ctx.beginPath();
      ctx.arc(0, 0, bird.radius, 0, Math.PI * 2);
      ctx.fill();

      // Eye
      ctx.fillStyle = '#ffffff';
      ctx.beginPath();
      ctx.arc(6, -4, 5, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#0f172a';
      ctx.beginPath();
      ctx.arc(8, -4, 2.5, 0, Math.PI * 2);
      ctx.fill();

      // Beak
      ctx.fillStyle = '#f97316';
      ctx.beginPath();
      ctx.moveTo(10, 0);
      ctx.lineTo(18, 4);
      ctx.lineTo(10, 8);
      ctx.closePath();
      ctx.fill();

      // Wing
      ctx.fillStyle = '#ca8a04';
      ctx.beginPath();
      ctx.ellipse(-4, 3, 7, 4, 0, 0, Math.PI * 2);
      ctx.fill();

      ctx.restore();

      // Overlay text / Scores
      if (gameState === 'PLAYING') {
        ctx.fillStyle = '#ffffff';
        ctx.strokeStyle = '#0f172a';
        ctx.lineWidth = 4;
        ctx.font = 'bold 36px system-ui';
        ctx.textAlign = 'center';
        ctx.strokeText(score, canvas.width / 2, 60);
        ctx.fillText(score, canvas.width / 2, 60);
      } else if (gameState === 'START') {
        ctx.fillStyle = 'rgba(15, 23, 42, 0.65)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        ctx.fillStyle = '#ffffff';
        ctx.font = 'bold 32px system-ui';
        ctx.textAlign = 'center';
        ctx.fillText('FLAPPY BIRD', canvas.width / 2, 180);

        ctx.font = '16px system-ui';
        ctx.fillStyle = '#cbd5e1';
        ctx.fillText('Tap or press Space to Start', canvas.width / 2, 230);
      } else if (gameState === 'OVER') {
        ctx.fillStyle = 'rgba(15, 23, 42, 0.75)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        ctx.fillStyle = '#ef4444';
        ctx.font = 'bold 34px system-ui';
        ctx.textAlign = 'center';
        ctx.fillText('GAME OVER', canvas.width / 2, 170);

        ctx.fillStyle = '#ffffff';
        ctx.font = 'bold 20px system-ui';
        ctx.fillText('Score: ' + score, canvas.width / 2, 220);
        ctx.fillStyle = '#facc15';
        ctx.fillText('Best: ' + highScore, canvas.width / 2, 255);

        ctx.font = '15px system-ui';
        ctx.fillStyle = '#94a3b8';
        ctx.fillText('Click to play again', canvas.width / 2, 310);
      }
    }

    loop();
  </script>
</body>
</html>
