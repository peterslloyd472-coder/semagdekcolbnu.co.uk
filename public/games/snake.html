<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Snake Classic</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      background: #0f172a;
      color: #f8fafc;
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
    }
    .header {
      display: flex;
      justify-content: space-between;
      width: 100%;
      max-width: 440px;
      padding: 12px 16px;
      font-size: 15px;
      font-weight: 600;
      color: #94a3b8;
    }
    .score-val { color: #38bdf8; font-size: 18px; }
    .best-val { color: #a855f7; font-size: 18px; }
    canvas {
      background: #1e293b;
      border: 3px solid #334155;
      border-radius: 12px;
      box-shadow: 0 10px 25px -5px rgba(0,0,0,0.5);
      image-rendering: pixelated;
    }
    .controls-hint {
      margin-top: 12px;
      font-size: 13px;
      color: #64748b;
      text-align: center;
    }
    .overlay {
      position: absolute;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: rgba(15, 23, 42, 0.88);
      border-radius: 12px;
      width: 400px;
      height: 400px;
      backdrop-filter: blur(4px);
    }
    .overlay h2 { font-size: 28px; margin-bottom: 8px; color: #f43f5e; }
    .overlay button {
      margin-top: 16px;
      padding: 10px 24px;
      background: #2563eb;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: 0.15s;
    }
    .overlay button:hover { background: #1d4ed8; transform: scale(1.03); }
    .d-pad {
      display: none;
      margin-top: 12px;
      grid-template-columns: repeat(3, 48px);
      gap: 6px;
    }
    @media (max-height: 540px), (max-width: 480px) {
      .d-pad { display: grid; }
    }
    .d-btn {
      width: 48px;
      height: 48px;
      background: #334155;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }
    .d-btn:active { background: #475569; }
  </style>
</head>
<body>
  <div class="header">
    <div>SCORE: <span class="score-val" id="score">0</span></div>
    <div>BEST: <span class="best-val" id="highScore">0</span></div>
  </div>

  <div style="position: relative; width: 400px; height: 400px;">
    <canvas id="gameCanvas" width="400" height="400"></canvas>
    <div class="overlay" id="overlay">
      <h2 id="overlayTitle">SNAKE</h2>
      <p style="color: #94a3b8; font-size: 14px;">Eat glowing food and don't hit the walls!</p>
      <button id="startBtn">PLAY NOW</button>
    </div>
  </div>

  <div class="controls-hint">Use <strong>Arrow Keys</strong> or <strong>W A S D</strong> to turn</div>

  <div class="d-pad">
    <div></div>
    <button class="d-btn" onclick="handleDir('UP')">▲</button>
    <div></div>
    <button class="d-btn" onclick="handleDir('LEFT')">◀</button>
    <button class="d-btn" onclick="handleDir('DOWN')">▼</button>
    <button class="d-btn" onclick="handleDir('RIGHT')">▶</button>
  </div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const scoreEl = document.getElementById('score');
    const highScoreEl = document.getElementById('highScore');
    const overlay = document.getElementById('overlay');
    const overlayTitle = document.getElementById('overlayTitle');
    const startBtn = document.getElementById('startBtn');

    const GRID = 20;
    const COUNT = 400 / GRID;
    let snake = [{x: 10, y: 10}];
    let dir = {x: 1, y: 0};
    let nextDir = {x: 1, y: 0};
    let food = {x: 15, y: 10};
    let score = 0;
    let highScore = localStorage.getItem('snake_high') || 0;
    highScoreEl.innerText = highScore;
    let gameLoop = null;
    let isRunning = false;

    // Web Audio synthesizer for bleeps
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function playBeep(freq, duration) {
      try {
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.type = 'square';
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
      } catch(e) {}
    }

    function spawnFood() {
      while (true) {
        food = {
          x: Math.floor(Math.random() * COUNT),
          y: Math.floor(Math.random() * COUNT)
        };
        if (!snake.some(s => s.x === food.x && s.y === food.y)) break;
      }
    }

    function startGame() {
      snake = [{x: 10, y: 10}, {x: 9, y: 10}, {x: 8, y: 10}];
      dir = {x: 1, y: 0};
      nextDir = {x: 1, y: 0};
      score = 0;
      scoreEl.innerText = score;
      spawnFood();
      overlay.style.display = 'none';
      isRunning = true;
      if (gameLoop) clearInterval(gameLoop);
      gameLoop = setInterval(update, 110);
    }

    function gameOver() {
      isRunning = false;
      clearInterval(gameLoop);
      playBeep(120, 0.4);
      if (score > highScore) {
        highScore = score;
        localStorage.setItem('snake_high', highScore);
        highScoreEl.innerText = highScore;
      }
      overlayTitle.innerText = 'GAME OVER';
      overlayTitle.style.color = '#ef4444';
      startBtn.innerText = 'PLAY AGAIN';
      overlay.style.display = 'flex';
    }

    function update() {
      dir = nextDir;
      const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };

      // Wall collision
      if (head.x < 0 || head.x >= COUNT || head.y < 0 || head.y >= COUNT) {
        gameOver();
        return;
      }

      // Self collision
      if (snake.some(s => s.x === head.x && s.y === head.y)) {
        gameOver();
        return;
      }

      snake.unshift(head);

      if (head.x === food.x && head.y === food.y) {
        score += 10;
        scoreEl.innerText = score;
        playBeep(520, 0.1);
        spawnFood();
      } else {
        snake.pop();
      }

      draw();
    }

    function draw() {
      ctx.fillStyle = '#1e293b';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Grid subtle lines
      ctx.strokeStyle = '#243347';
      ctx.lineWidth = 1;
      for (let i = 0; i < canvas.width; i += GRID) {
        ctx.beginPath();
        ctx.moveTo(i, 0); ctx.lineTo(i, canvas.height);
        ctx.moveTo(0, i); ctx.lineTo(canvas.width, i);
        ctx.stroke();
      }

      // Draw food
      ctx.fillStyle = '#ef4444';
      ctx.beginPath();
      ctx.arc(food.x * GRID + GRID/2, food.y * GRID + GRID/2, GRID/2 - 2, 0, Math.PI * 2);
      ctx.fill();

      // Draw snake
      snake.forEach((segment, i) => {
        if (i === 0) {
          ctx.fillStyle = '#10b981'; // Head
        } else {
          ctx.fillStyle = '#34d399';
        }
        ctx.beginPath();
        ctx.roundRect(segment.x * GRID + 1, segment.y * GRID + 1, GRID - 2, GRID - 2, 4);
        ctx.fill();
      });
    }

    function handleDir(direction) {
      if (direction === 'UP' && dir.y === 0) nextDir = {x: 0, y: -1};
      if (direction === 'DOWN' && dir.y === 0) nextDir = {x: 0, y: 1};
      if (direction === 'LEFT' && dir.x === 0) nextDir = {x: -1, y: 0};
      if (direction === 'RIGHT' && dir.x === 0) nextDir = {x: 1, y: 0};
    }

    window.addEventListener('keydown', e => {
      if (!isRunning && (e.key === ' ' || e.key === 'Enter')) {
        startGame();
        return;
      }
      if (['ArrowUp', 'KeyW'].includes(e.code)) { handleDir('UP'); e.preventDefault(); }
      if (['ArrowDown', 'KeyS'].includes(e.code)) { handleDir('DOWN'); e.preventDefault(); }
      if (['ArrowLeft', 'KeyA'].includes(e.code)) { handleDir('LEFT'); e.preventDefault(); }
      if (['ArrowRight', 'KeyD'].includes(e.code)) { handleDir('RIGHT'); e.preventDefault(); }
    });

    startBtn.addEventListener('click', startGame);
    draw();
  </script>
</body>
</html>
