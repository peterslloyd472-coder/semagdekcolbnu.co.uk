<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tetris Blocks</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      background: #0f172a;
      color: #f8fafc;
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
      padding: 12px;
    }
    .wrapper {
      display: flex;
      gap: 20px;
      align-items: flex-start;
    }
    canvas#tetris {
      background: #1e293b;
      border: 3px solid #334155;
      border-radius: 8px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    }
    .side-panel {
      display: flex;
      flex-direction: column;
      gap: 14px;
      width: 130px;
    }
    .box {
      background: #1e293b;
      border: 2px solid #334155;
      border-radius: 8px;
      padding: 10px;
      text-align: center;
    }
    .box-title {
      font-size: 11px;
      font-weight: 700;
      color: #94a3b8;
      text-transform: uppercase;
      margin-bottom: 4px;
    }
    .box-val {
      font-size: 20px;
      font-weight: 700;
      color: #38bdf8;
    }
    canvas#next {
      background: #0f172a;
      border-radius: 6px;
      display: block;
      margin: 4px auto 0;
    }
    .btn {
      background: #2563eb;
      color: white;
      border: none;
      border-radius: 6px;
      padding: 8px;
      font-weight: 600;
      cursor: pointer;
    }
    .btn:hover { background: #1d4ed8; }
    .hint {
      margin-top: 12px;
      font-size: 13px;
      color: #64748b;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="wrapper">
    <canvas id="tetris" width="240" height="400"></canvas>
    <div class="side-panel">
      <div class="box">
        <div class="box-title">Score</div>
        <div class="box-val" id="score">0</div>
      </div>
      <div class="box">
        <div class="box-title">Lines</div>
        <div class="box-val" id="lines">0</div>
      </div>
      <div class="box">
        <div class="box-title">Next</div>
        <canvas id="next" width="80" height="80"></canvas>
      </div>
      <button class="btn" onclick="startGame()">Reset</button>
    </div>
  </div>

  <div class="hint">
    <strong>Arrows</strong>: ◀ / ▶ Move, ▲ Rotate, ▼ Drop Fast | <strong>Space</strong>: Hard drop
  </div>

  <script>
    const canvas = document.getElementById('tetris');
    const ctx = canvas.getContext('2d');
    const nextCanvas = document.getElementById('next');
    const nextCtx = nextCanvas.getContext('2d');
    const scoreEl = document.getElementById('score');
    const linesEl = document.getElementById('lines');

    const COLS = 10;
    const ROWS = 20;
    const BLOCK_SIZE = 24;

    ctx.scale(BLOCK_SIZE, BLOCK_SIZE);
    nextCtx.scale(20, 20);

    const PIECES = 'ILJOTSZ';
    const COLORS = [
      null,
      '#06b6d4', // I cyan
      '#3b82f6', // J blue
      '#f97316', // L orange
      '#eab308', // O yellow
      '#22c55e', // T green/lime
      '#a855f7', // S purple
      '#ef4444', // Z red
    ];

    function createMatrix(w, h) {
      const matrix = [];
      while (h--) matrix.push(new Array(w).fill(0));
      return matrix;
    }

    function createPiece(type) {
      if (type === 'I') return [[0,1,0,0],[0,1,0,0],[0,1,0,0],[0,1,0,0]];
      if (type === 'J') return [[0,2,0],[0,2,0],[2,2,0]];
      if (type === 'L') return [[0,3,0],[0,3,0],[0,3,3]];
      if (type === 'O') return [[4,4],[4,4]];
      if (type === 'T') return [[0,5,0],[5,5,5],[0,0,0]];
      if (type === 'S') return [[0,6,6],[6,6,0],[0,0,0]];
      if (type === 'Z') return [[7,7,0],[0,7,7],[0,0,0]];
    }

    let arena = createMatrix(COLS, ROWS);
    let dropCounter = 0;
    let dropInterval = 800;
    let lastTime = 0;
    let score = 0;
    let lines = 0;
    let gameOver = false;

    const player = {
      pos: {x: 0, y: 0},
      matrix: null,
      score: 0
    };
    let nextPiece = null;

    function collide(arena, player) {
      const [m, o] = [player.matrix, player.pos];
      for (let y = 0; y < m.length; ++y) {
        for (let x = 0; x < m[y].length; ++x) {
          if (m[y][x] !== 0 && (arena[y + o.y] && arena[y + o.y][x + o.x]) !== 0) {
            return true;
          }
        }
      }
      return false;
    }

    function merge(arena, player) {
      player.matrix.forEach((row, y) => {
        row.forEach((value, x) => {
          if (value !== 0) {
            arena[y + player.pos.y][x + player.pos.x] = value;
          }
        });
      });
    }

    function rotate(matrix, dir) {
      for (let y = 0; y < matrix.length; ++y) {
        for (let x = 0; x < y; ++x) {
          [matrix[x][y], matrix[y][x]] = [matrix[y][x], matrix[x][y]];
        }
      }
      if (dir > 0) matrix.forEach(row => row.reverse());
      else matrix.reverse();
    }

    function playerRotate(dir) {
      const pos = player.pos.x;
      let offset = 1;
      rotate(player.matrix, dir);
      while (collide(arena, player)) {
        player.pos.x += offset;
        offset = -(offset + (offset > 0 ? 1 : -1));
        if (offset > player.matrix[0].length) {
          rotate(player.matrix, -dir);
          player.pos.x = pos;
          return;
        }
      }
    }

    function playerReset() {
      if (!nextPiece) {
        nextPiece = createPiece(PIECES[Math.floor(Math.random() * PIECES.length)]);
      }
      player.matrix = nextPiece;
      nextPiece = createPiece(PIECES[Math.floor(Math.random() * PIECES.length)]);
      player.pos.y = 0;
      player.pos.x = ((COLS / 2) | 0) - ((player.matrix[0].length / 2) | 0);

      drawNext();

      if (collide(arena, player)) {
        gameOver = true;
      }
    }

    function arenaSweep() {
      let rowCount = 1;
      outer: for (let y = arena.length - 1; y > 0; --y) {
        for (let x = 0; x < arena[y].length; ++x) {
          if (arena[y][x] === 0) continue outer;
        }
        const row = arena.splice(y, 1)[0].fill(0);
        arena.unshift(row);
        ++y;
        score += rowCount * 100;
        lines++;
        rowCount *= 2;
      }
      scoreEl.innerText = score;
      linesEl.innerText = lines;
    }

    function playerDrop() {
      player.pos.y++;
      if (collide(arena, player)) {
        player.pos.y--;
        merge(arena, player);
        playerReset();
        arenaSweep();
      }
      dropCounter = 0;
    }

    function playerHardDrop() {
      while (!collide(arena, player)) {
        player.pos.y++;
      }
      player.pos.y--;
      merge(arena, player);
      playerReset();
      arenaSweep();
      dropCounter = 0;
    }

    function playerMove(dir) {
      player.pos.x += dir;
      if (collide(arena, player)) player.pos.x -= dir;
    }

    function drawMatrix(matrix, offset, context) {
      matrix.forEach((row, y) => {
        row.forEach((value, x) => {
          if (value !== 0) {
            context.fillStyle = COLORS[value];
            context.fillRect(x + offset.x, y + offset.y, 0.95, 0.95);
          }
        });
      });
    }

    function drawNext() {
      nextCtx.fillStyle = '#0f172a';
      nextCtx.fillRect(0, 0, 4, 4);
      if (nextPiece) {
        const offX = (4 - nextPiece[0].length) / 2;
        const offY = (4 - nextPiece.length) / 2;
        drawMatrix(nextPiece, {x: offX, y: offY}, nextCtx);
      }
    }

    function draw() {
      ctx.fillStyle = '#1e293b';
      ctx.fillRect(0, 0, COLS, ROWS);

      drawMatrix(arena, {x: 0, y: 0}, ctx);
      if (player.matrix) {
        drawMatrix(player.matrix, player.pos, ctx);
      }

      if (gameOver) {
        ctx.fillStyle = 'rgba(15, 23, 42, 0.85)';
        ctx.fillRect(0, 0, COLS, ROWS);
        ctx.fillStyle = '#ef4444';
        ctx.font = '1px system-ui';
        ctx.textAlign = 'center';
        ctx.fillText('GAME OVER', COLS / 2, ROWS / 2);
      }
    }

    function update(time = 0) {
      const deltaTime = time - lastTime;
      lastTime = time;

      if (!gameOver) {
        dropCounter += deltaTime;
        if (dropCounter > dropInterval) playerDrop();
      }

      draw();
      requestAnimationFrame(update);
    }

    function startGame() {
      arena.forEach(row => row.fill(0));
      score = 0;
      lines = 0;
      scoreEl.innerText = score;
      linesEl.innerText = lines;
      gameOver = false;
      playerReset();
    }

    window.addEventListener('keydown', e => {
      if (gameOver) {
        if (e.code === 'Space' || e.code === 'Enter') startGame();
        return;
      }
      if (e.code === 'ArrowLeft' || e.code === 'KeyA') { playerMove(-1); e.preventDefault(); }
      if (e.code === 'ArrowRight' || e.code === 'KeyD') { playerMove(1); e.preventDefault(); }
      if (e.code === 'ArrowDown' || e.code === 'KeyS') { playerDrop(); e.preventDefault(); }
      if (e.code === 'ArrowUp' || e.code === 'KeyW') { playerRotate(1); e.preventDefault(); }
      if (e.code === 'Space') { playerHardDrop(); e.preventDefault(); }
    });

    startGame();
    update();
  </script>
</body>
</html>
