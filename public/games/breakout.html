<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Retro Breakout</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      background: #090d16;
      color: #f1f5f9;
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
    }
    .hud {
      display: flex;
      justify-content: space-between;
      width: 480px;
      max-width: 95vw;
      padding: 8px 12px;
      font-size: 15px;
      font-weight: 600;
      color: #94a3b8;
    }
    .val { color: #38bdf8; font-size: 17px; }
    canvas {
      background: #0f172a;
      border: 3px solid #1e293b;
      border-radius: 12px;
      box-shadow: 0 12px 30px rgba(0,0,0,0.6);
      cursor: none;
    }
    .hint {
      margin-top: 10px;
      font-size: 13px;
      color: #64748b;
    }
  </style>
</head>
<body>
  <div class="hud">
    <div>SCORE: <span class="val" id="score">0</span></div>
    <div>LIVES: <span class="val" id="lives" style="color: #f43f5e;">❤❤❤</span></div>
  </div>
  <canvas id="canvas" width="480" height="420"></canvas>
  <div class="hint">Move <strong>Mouse</strong> or use <strong>LEFT / RIGHT ARROWS</strong>. Click or press Space to launch.</div>

  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const scoreEl = document.getElementById('score');
    const livesEl = document.getElementById('lives');

    let score = 0;
    let lives = 3;
    let gameState = 'READY'; // 'READY' | 'PLAYING' | 'OVER' | 'WIN'

    const paddle = {
      width: 80,
      height: 12,
      x: (canvas.width - 80) / 2,
      speed: 7
    };

    const ball = {
      x: canvas.width / 2,
      y: canvas.height - 30,
      dx: 4,
      dy: -4,
      radius: 6,
      stuck: true
    };

    const brickRowCount = 5;
    const brickColumnCount = 7;
    const brickWidth = 56;
    const brickHeight = 16;
    const brickPadding = 8;
    const brickOffsetTop = 40;
    const brickOffsetLeft = 20;

    const brickColors = ['#ef4444', '#f97316', '#eab308', '#22c55e', '#3b82f6'];
    let bricks = [];

    function initBricks() {
      bricks = [];
      for (let c = 0; c < brickColumnCount; c++) {
        bricks[c] = [];
        for (let r = 0; r < brickRowCount; r++) {
          bricks[c][r] = { x: 0, y: 0, status: 1, color: brickColors[r] };
        }
      }
    }

    function resetBall() {
      ball.stuck = true;
      ball.x = paddle.x + paddle.width / 2;
      ball.y = canvas.height - paddle.height - ball.radius - 2;
      ball.dx = (Math.random() > 0.5 ? 4 : -4);
      ball.dy = -4;
    }

    function initGame() {
      score = 0;
      lives = 3;
      scoreEl.innerText = score;
      updateLivesDisplay();
      initBricks();
      paddle.x = (canvas.width - paddle.width) / 2;
      resetBall();
      gameState = 'READY';
    }

    function updateLivesDisplay() {
      livesEl.innerText = '❤'.repeat(Math.max(0, lives));
    }

    let rightPressed = false;
    let leftPressed = false;

    window.addEventListener('keydown', e => {
      if (e.code === 'ArrowRight') rightPressed = true;
      if (e.code === 'ArrowLeft') leftPressed = true;
      if (e.code === 'Space') {
        if (gameState === 'READY') {
          gameState = 'PLAYING';
          ball.stuck = false;
        } else if (gameState === 'OVER' || gameState === 'WIN') {
          initGame();
        }
        e.preventDefault();
      }
    });

    window.addEventListener('keyup', e => {
      if (e.code === 'ArrowRight') rightPressed = false;
      if (e.code === 'ArrowLeft') leftPressed = false;
    });

    canvas.addEventListener('mousemove', e => {
      const rect = canvas.getBoundingClientRect();
      const relativeX = e.clientX - rect.left;
      if (relativeX > 0 && relativeX < canvas.width) {
        paddle.x = Math.max(0, Math.min(canvas.width - paddle.width, relativeX - paddle.width / 2));
        if (ball.stuck) {
          ball.x = paddle.x + paddle.width / 2;
        }
      }
    });

    canvas.addEventListener('click', () => {
      if (gameState === 'READY') {
        gameState = 'PLAYING';
        ball.stuck = false;
      } else if (gameState === 'OVER' || gameState === 'WIN') {
        initGame();
      }
    });

    function collisionDetection() {
      let activeBricks = 0;
      for (let c = 0; c < brickColumnCount; c++) {
        for (let r = 0; r < brickRowCount; r++) {
          const b = bricks[c][r];
          if (b.status === 1) {
            activeBricks++;
            if (
              ball.x > b.x &&
              ball.x < b.x + brickWidth &&
              ball.y > b.y &&
              ball.y < b.y + brickHeight
            ) {
              ball.dy = -ball.dy;
              b.status = 0;
              score += 10 * (brickRowCount - r);
              scoreEl.innerText = score;
            }
          }
        }
      }
      if (activeBricks === 0) {
        gameState = 'WIN';
      }
    }

    function update() {
      if (rightPressed && paddle.x < canvas.width - paddle.width) {
        paddle.x += paddle.speed;
        if (ball.stuck) ball.x = paddle.x + paddle.width / 2;
      } else if (leftPressed && paddle.x > 0) {
        paddle.x -= paddle.speed;
        if (ball.stuck) ball.x = paddle.x + paddle.width / 2;
      }

      if (gameState === 'PLAYING') {
        ball.x += ball.dx;
        ball.y += ball.dy;

        // Bounce left and right
        if (ball.x + ball.dx > canvas.width - ball.radius || ball.x + ball.dx < ball.radius) {
          ball.dx = -ball.dx;
        }

        // Bounce top
        if (ball.y + ball.dy < ball.radius) {
          ball.dy = -ball.dy;
        } else if (ball.y + ball.dy > canvas.height - paddle.height - ball.radius) {
          // Paddle check
          if (ball.x > paddle.x - 4 && ball.x < paddle.x + paddle.width + 4) {
            // Angle based on hit position
            const hitPoint = (ball.x - (paddle.x + paddle.width / 2)) / (paddle.width / 2);
            ball.dx = hitPoint * 6;
            ball.dy = -Math.abs(ball.dy);
          } else if (ball.y + ball.dy > canvas.height - ball.radius) {
            // Missed paddle
            lives--;
            updateLivesDisplay();
            if (lives <= 0) {
              gameState = 'OVER';
            } else {
              gameState = 'READY';
              resetBall();
            }
          }
        }

        collisionDetection();
      }
    }

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // Draw bricks
      for (let c = 0; c < brickColumnCount; c++) {
        for (let r = 0; r < brickRowCount; r++) {
          if (bricks[c][r].status === 1) {
            const brickX = c * (brickWidth + brickPadding) + brickOffsetLeft;
            const brickY = r * (brickHeight + brickPadding) + brickOffsetTop;
            bricks[c][r].x = brickX;
            bricks[c][r].y = brickY;
            ctx.fillStyle = bricks[c][r].color;
            ctx.beginPath();
            ctx.roundRect(brickX, brickY, brickWidth, brickHeight, 3);
            ctx.fill();
          }
        }
      }

      // Draw paddle
      ctx.fillStyle = '#38bdf8';
      ctx.beginPath();
      ctx.roundRect(paddle.x, canvas.height - paddle.height - 4, paddle.width, paddle.height, 6);
      ctx.fill();

      // Draw ball
      ctx.fillStyle = '#f8fafc';
      ctx.beginPath();
      ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI * 2);
      ctx.fill();

      // Messages
      if (gameState === 'READY') {
        ctx.fillStyle = 'rgba(15, 23, 42, 0.7)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = '#ffffff';
        ctx.font = 'bold 22px system-ui';
        ctx.textAlign = 'center';
        ctx.fillText('CLICK OR PRESS SPACE TO LAUNCH', canvas.width / 2, canvas.height / 2 + 30);
      } else if (gameState === 'OVER') {
        ctx.fillStyle = 'rgba(15, 23, 42, 0.85)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = '#ef4444';
        ctx.font = 'bold 30px system-ui';
        ctx.textAlign = 'center';
        ctx.fillText('GAME OVER', canvas.width / 2, canvas.height / 2);
        ctx.fillStyle = '#94a3b8';
        ctx.font = '16px system-ui';
        ctx.fillText('Click to Try Again', canvas.width / 2, canvas.height / 2 + 40);
      } else if (gameState === 'WIN') {
        ctx.fillStyle = 'rgba(15, 23, 42, 0.85)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = '#22c55e';
        ctx.font = 'bold 32px system-ui';
        ctx.textAlign = 'center';
        ctx.fillText('YOU CLEARED THE BOARD!', canvas.width / 2, canvas.height / 2);
        ctx.fillStyle = '#ffffff';
        ctx.font = '18px system-ui';
        ctx.fillText('Final Score: ' + score, canvas.width / 2, canvas.height / 2 + 40);
      }
    }

    function loop() {
      update();
      draw();
      requestAnimationFrame(loop);
    }

    initGame();
    loop();
  </script>
</body>
</html>
