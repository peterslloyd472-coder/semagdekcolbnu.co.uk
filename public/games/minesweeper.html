<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Minesweeper</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      background: #0f172a;
      color: #f8fafc;
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 16px;
    }
    .window {
      background: #1e293b;
      border: 3px solid #334155;
      border-radius: 10px;
      padding: 16px;
      box-shadow: 0 15px 30px rgba(0,0,0,0.5);
    }
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #0f172a;
      border: 2px solid #334155;
      border-radius: 6px;
      padding: 8px 16px;
      margin-bottom: 14px;
      font-family: 'Courier New', Courier, monospace;
      font-weight: bold;
    }
    .counter {
      font-size: 24px;
      color: #ef4444;
      background: #020617;
      padding: 2px 8px;
      border-radius: 4px;
    }
    .face-btn {
      font-size: 24px;
      background: #334155;
      border: none;
      border-radius: 6px;
      width: 38px;
      height: 38px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .face-btn:hover { background: #475569; }
    .board {
      display: grid;
      grid-template-columns: repeat(9, 34px);
      grid-template-rows: repeat(9, 34px);
      gap: 3px;
    }
    .cell {
      background: #334155;
      border-radius: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      font-size: 16px;
      cursor: pointer;
      box-shadow: inset 1px 1px 0 rgba(255,255,255,0.15), inset -1px -1px 0 rgba(0,0,0,0.3);
    }
    .cell:hover { background: #3b4d66; }
    .cell.revealed {
      background: #0f172a;
      box-shadow: none;
      cursor: default;
    }
    .cell.mine { background: #ef4444 !important; }
    .c-1 { color: #38bdf8; }
    .c-2 { color: #4ade80; }
    .c-3 { color: #f87171; }
    .c-4 { color: #818cf8; }
    .c-5 { color: #fbbf24; }
    .c-6 { color: #2dd4bf; }
    .hint {
      margin-top: 14px;
      font-size: 13px;
      color: #64748b;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="window">
    <div class="top-bar">
      <div class="counter" id="mineCount">010</div>
      <button class="face-btn" id="faceBtn" onclick="initGame()">🙂</button>
      <div class="counter" id="timer">000</div>
    </div>
    <div class="board" id="board"></div>
  </div>
  <div class="hint">Left Click to Reveal | Right Click (or hold) to Flag 🚩</div>

  <script>
    const ROWS = 9;
    const COLS = 9;
    const MINES = 10;
    let grid = [];
    let gameOver = false;
    let flags = 0;
    let timer = 0;
    let timerInterval = null;
    let firstClick = true;

    const boardEl = document.getElementById('board');
    const mineCountEl = document.getElementById('mineCount');
    const timerEl = document.getElementById('timer');
    const faceBtn = document.getElementById('faceBtn');

    function initGame() {
      gameOver = false;
      flags = 0;
      timer = 0;
      firstClick = true;
      if (timerInterval) clearInterval(timerInterval);
      timerEl.innerText = '000';
      mineCountEl.innerText = String(MINES).padStart(3, '0');
      faceBtn.innerText = '🙂';

      grid = [];
      boardEl.innerHTML = '';

      for (let r = 0; r < ROWS; r++) {
        grid[r] = [];
        for (let c = 0; c < COLS; c++) {
          grid[r][c] = {
            r, c,
            mine: false,
            revealed: false,
            flagged: false,
            adjacent: 0
          };
          const el = document.createElement('div');
          el.className = 'cell';
          el.dataset.r = r;
          el.dataset.c = c;
          el.addEventListener('click', () => handleClick(r, c));
          el.addEventListener('contextmenu', (e) => {
            e.preventDefault();
            handleRightClick(r, c);
          });
          boardEl.appendChild(el);
        }
      }
    }

    function plantMines(excludeR, excludeC) {
      let planted = 0;
      while (planted < MINES) {
        const r = Math.floor(Math.random() * ROWS);
        const c = Math.floor(Math.random() * COLS);
        if ((r === excludeR && c === excludeC) || grid[r][c].mine) continue;
        grid[r][c].mine = true;
        planted++;
      }

      // Calculate neighbor counts
      for (let r = 0; r < ROWS; r++) {
        for (let c = 0; c < COLS; c++) {
          if (grid[r][c].mine) continue;
          let count = 0;
          for (let dr = -1; dr <= 1; dr++) {
            for (let dc = -1; dc <= 1; dc++) {
              const nr = r + dr, nc = c + dc;
              if (nr >= 0 && nr < ROWS && nc >= 0 && nc < COLS && grid[nr][nc].mine) {
                count++;
              }
            }
          }
          grid[r][c].adjacent = count;
        }
      }
    }

    function handleClick(r, c) {
      if (gameOver) return;
      const cell = grid[r][c];
      if (cell.revealed || cell.flagged) return;

      if (firstClick) {
        firstClick = false;
        plantMines(r, c);
        timerInterval = setInterval(() => {
          timer++;
          timerEl.innerText = String(Math.min(999, timer)).padStart(3, '0');
        }, 1000);
      }

      if (cell.mine) {
        // Explode
        gameOver = true;
        clearInterval(timerInterval);
        faceBtn.innerText = '😵';
        revealAllMines();
        return;
      }

      revealCell(r, c);
      checkWin();
    }

    function revealCell(r, c) {
      const cell = grid[r][c];
      if (cell.revealed || cell.flagged) return;
      cell.revealed = true;

      const el = getCellEl(r, c);
      el.classList.add('revealed');

      if (cell.adjacent > 0) {
        el.innerText = cell.adjacent;
        el.classList.add('c-' + cell.adjacent);
      } else {
        // Flood fill
        for (let dr = -1; dr <= 1; dr++) {
          for (let dc = -1; dc <= 1; dc++) {
            const nr = r + dr, nc = c + dc;
            if (nr >= 0 && nr < ROWS && nc >= 0 && nc < COLS) {
              revealCell(nr, nc);
            }
          }
        }
      }
    }

    function handleRightClick(r, c) {
      if (gameOver || firstClick) return;
      const cell = grid[r][c];
      if (cell.revealed) return;

      cell.flagged = !cell.flagged;
      flags += cell.flagged ? 1 : -1;
      mineCountEl.innerText = String(Math.max(0, MINES - flags)).padStart(3, '0');

      const el = getCellEl(r, c);
      el.innerText = cell.flagged ? '🚩' : '';
      checkWin();
    }

    function revealAllMines() {
      for (let r = 0; r < ROWS; r++) {
        for (let c = 0; c < COLS; c++) {
          if (grid[r][c].mine) {
            const el = getCellEl(r, c);
            el.classList.add('mine');
            el.innerText = '💣';
          }
        }
      }
    }

    function checkWin() {
      let unrevealedSafe = 0;
      for (let r = 0; r < ROWS; r++) {
        for (let c = 0; c < COLS; c++) {
          if (!grid[r][c].mine && !grid[r][c].revealed) unrevealedSafe++;
        }
      }
      if (unrevealedSafe === 0) {
        gameOver = true;
        clearInterval(timerInterval);
        faceBtn.innerText = '😎';
      }
    }

    function getCellEl(r, c) {
      return boardEl.children[r * COLS + c];
    }

    initGame();
  </script>
</body>
</html>
